<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  @keyframes bh-flash{0%,49%{opacity:1}50%,100%{opacity:.28}}
  @keyframes bh-halo{0%{opacity:.45;transform:scale(.55)}100%{opacity:0;transform:scale(1.7)}}
  @keyframes bh-cardpulse{0%,49%{box-shadow:0 0 0 1.5px #FF4D4D, 0 10px 34px -12px rgba(255,77,77,.5)}50%,100%{box-shadow:0 0 0 1.5px #7a2230, 0 10px 34px -12px rgba(255,77,77,.2)}}
  [data-alarm="prox"] .bh-comp,[data-alarm="move"] .bh-comp{animation:bh-flash .6s steps(1,end) infinite}
  .bh-halo{transform-box:fill-box;transform-origin:center;animation:bh-halo 1.3s ease-out infinite}
  .bh-warn{animation:bh-flash .66s steps(1,end) infinite}
  .bh-alarmcard{animation:bh-cardpulse 1.1s steps(1,end) infinite}
  .fleet-scroll::-webkit-scrollbar{width:10px;height:10px}
  .fleet-scroll::-webkit-scrollbar-thumb{background:#2a3744;border-radius:6px}
  .fleet-scroll::-webkit-scrollbar-track{background:transparent}
  @media (prefers-reduced-motion: reduce){
    [data-alarm="prox"] .bh-comp,[data-alarm="move"] .bh-comp{animation:none;opacity:1}
    .bh-halo{animation:none;opacity:.3}.bh-warn{animation:none;opacity:1}
    .bh-alarmcard{animation:none;box-shadow:0 0 0 1.5px #FF4D4D, 0 10px 34px -12px rgba(255,77,77,.4)}
  }
</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;padding:30px 34px 40px;background:#080b0f;font-family:Inter,sans-serif">

  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:24px;flex-wrap:wrap">
    <div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#5d6b7b;margin-bottom:8px">Fleet bucket health</div>
      <h1 style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:30px;color:#EAF0F7;margin:0;letter-spacing:-.01em">Live monitoring · {{ count }} {{ machineWord }}</h1>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <sc-if value="{{ fleetHasAlarm }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:8px;background:#221310;border:1px solid #4a2317;padding:8px 14px;border-radius:10px">
          <span style="width:9px;height:9px;border-radius:50%;background:#FF5A5A"></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#f6cba6;font-weight:600;letter-spacing:.04em">{{ fleetAlarmText }}</span>
        </div>
      </sc-if>
      <div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#10161d;border:1px solid #1f2a35;padding:8px 14px;border-radius:10px">
        <sc-for list="{{ legend }}" as="s" hint-placeholder-count="6">
          <span style="display:inline-flex;align-items:center;gap:6px">
            <span style="width:10px;height:10px;border-radius:3px;background:{{ s.color }}"></span>
            <span style="font-size:11px;color:#9aa8b7">{{ s.label }}</span>
          </span>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="fleet-scroll" style="display:grid;grid-template-columns:{{ gridCols }};gap:16px;max-height:80vh;overflow:auto;padding:2px 6px 2px 2px">
    <sc-for list="{{ machines }}" as="m" hint-placeholder-count="6">
      <div class="{{ m.cardClass }}" style="background:radial-gradient(130% 110% at 50% -10%, #18212b 0%, #111922 55%, #0c1117 100%);border:1.5px solid {{ m.border }};border-radius:14px;padding:14px 16px 12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="display:flex;align-items:baseline;gap:9px">
            <span style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:18px;color:#F2F6FB">{{ m.name }}</span>
            <span style="font-size:10.5px;color:#62717f;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em">{{ m.type }}</span>
          </div>
          <span style="display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;background:{{ m.chipBg }};color:{{ m.chipFg }}">
            <span style="width:7px;height:7px;border-radius:50%;background:{{ m.chipDot }}"></span>{{ m.chipText }}
          </span>
        </div>
        <svg viewBox="{{ m.vb }}" style="width:100%;height:auto;display:block">
          <defs>
            <linearGradient id="bodyG-{{ m.id }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39434e"></stop><stop offset="0.55" stop-color="#262e38"></stop><stop offset="1" stop-color="#1a212a"></stop></linearGradient>
            <radialGradient id="cavG-{{ m.id }}" cx="0.5" cy="0.24" r="0.95"><stop offset="0" stop-color="#0b1016"></stop><stop offset="0.6" stop-color="#10171f"></stop><stop offset="1" stop-color="#1b232c"></stop></radialGradient>
          </defs>
          <path d="{{ m.body.shell }}" fill="url(#bodyG-{{ m.id }})" stroke="#465465" stroke-width="2" stroke-linejoin="round"></path>
          <g transform="{{ m.bracketTf }}">
            <path d="M 296 94 Q 312 52 338 40 Q 360 31 382 40 Q 404 51 410 82 Q 424 94 440 94 Q 456 94 470 82 Q 476 51 498 40 Q 520 31 542 40 Q 568 52 584 94 Z" fill="#4a usk" fill="#46505c" stroke="#161d25" stroke-width="1.6" stroke-linejoin="round"></path>
            <rect x="320" y="49" width="240" height="26" rx="13" fill="#6b7785" stroke="#161d25" stroke-width="1.2"></rect>
          </g>
          <path d="{{ m.body.cavity }}" fill="url(#cavG-{{ m.id }})" stroke="#2c3744" stroke-width="1.5"></path>
          <sc-for list="{{ m.guard }}" as="g" hint-placeholder-count="14"><rect x="{{ g.x }}" y="{{ g.y }}" width="{{ g.w }}" height="{{ g.h }}" rx="1.5" fill="#2b3540" stroke="#465465" stroke-width="0.8"></rect></sc-for>
          <path d="{{ m.beam.path }}" fill="#3a4350" stroke="#465465" stroke-width="1.5" stroke-linejoin="round"></path>
          <sc-for list="{{ m.wings }}" as="w" hint-placeholder-count="6"><g data-alarm="{{ w.alarm }}"><polygon class="bh-comp" points="{{ w.face }}" fill="{{ w.color }}" stroke="{{ w.stroke }}" stroke-width="1.5" stroke-linejoin="round"></polygon></g></sc-for>
          <sc-for list="{{ m.lips }}" as="l" hint-placeholder-count="9"><g data-alarm="{{ l.alarm }}"><rect class="bh-comp" x="{{ l.x }}" y="{{ l.y }}" width="{{ l.w }}" height="{{ l.h }}" rx="3" fill="{{ l.color }}" stroke="{{ l.stroke }}" stroke-width="1.5"></rect></g></sc-for>
          <sc-for list="{{ m.teeth }}" as="t" hint-placeholder-count="10"><g data-alarm="{{ t.alarm }}"><path class="bh-comp" d="{{ t.path }}" fill="{{ t.color }}" stroke="{{ t.stroke }}" stroke-width="1.5" stroke-linejoin="round"></path></g></sc-for>
          <sc-for list="{{ m.rings }}" as="a" hint-placeholder-count="2"><circle class="bh-warn" cx="{{ a.cx }}" cy="{{ a.cy }}" r="{{ a.r }}" fill="none" stroke="{{ a.color }}" stroke-width="2.6"></circle></sc-for>
          <sc-if value="{{ m.hasAlarm }}" hint-placeholder-val="{{ false }}">
            <g transform="{{ m.alarm.tf }}">
              <circle class="bh-halo" r="50" fill="#FF4D4D" opacity="0.16"></circle>
              <g class="bh-warn">
                <path d="M 0 -32 L 36 28 L -36 28 Z" fill="#2a0e0e" stroke="#FF4D4D" stroke-width="3.5" stroke-linejoin="round"></path>
                <rect x="-3.6" y="-15" width="7.2" height="24" rx="3.6" fill="#FF6A6A"></rect>
                <circle cx="0" cy="18" r="3.8" fill="#FF6A6A"></circle>
              </g>
            </g>
          </sc-if>
        </svg>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;machineCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 6, &quot;min&quot;: 1, &quot;max&quot;: 20, &quot;step&quot;: 1}
}">
class Component extends DCLogic {
  renderVals() {
    const BASE = { ok:"#34D399", nodata:"#F4C04E", lockout:"#5BA8F5", lockoutnd:"#3B5BD9", prox:"#FF5A5A", move:"#C42B4A" };
    const LABELS = { ok:"OK", nodata:"No data", lockout:"Lockout", lockoutnd:"Lockout+ND", prox:"Proximity", move:"Movement" };
    const hexToRgb = h => { h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
    const rgbToHex = r => "#"+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
    const mix = (a,b,t) => { const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex(A.map((v,i)=>v+(B[i]-v)*t)); };
    const sk = s => mix(BASE[s],"#000000",0.42);
    const f = v => (Math.round(v*10)/10);
    const P = (...pts) => pts.map(p=>f(p[0])+","+f(p[1])).join(" ");
    const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    const isAlarm = s => s==="prox"||s==="move";

    // ===== shared bucket geometry builder =====
    const buildBucket = (n, wps, tMap, lMap, wMap) => {
      const SLOT=66, TOOTH_W=36, TOOTH_H=62, LIP_W=22, LIP_H=24;
      const WING_HL=24, WING_IN=11, WING_OUT=14, MARGIN=72;
      const halfBot=n*SLOT/2, halfTop=halfBot*0.84, topY=86, bucketH=116+wps*46, botY=topY+bucketH;
      const CX=halfBot+MARGIN, vbW=2*CX, vbH=botY+TOOTH_H+40;
      const TL=[CX-halfTop,topY],TR=[CX+halfTop,topY],BL=[CX-halfBot,botY],BR=[CX+halfBot,botY];
      const iTL=[TL[0]+38,topY+26],iTR=[TR[0]-38,topY+26],iBL=[BL[0]+54,botY-14],iBR=[BR[0]-54,botY-14];
      const body={ shell:`M ${P(TL)} L ${P(TR)} L ${P(BR)} L ${P(BL)} Z`, cavity:`M ${P(iTL)} L ${P(iTR)} L ${P(iBR)} L ${P(iBL)} Z` };
      const sB=Math.max(0.6,Math.min(1.05,(2*halfTop)/320));
      const bracketTf=`translate(${f(CX)} ${f(topY)}) scale(${Math.round(sB*1000)/1000}) translate(-440 -94)`;
      const guard=[]; const gw=TR[0]-TL[0], gc=Math.max(5,Math.floor(gw/26));
      for(let i=0;i<gc;i++){ const t=i/(gc-1); const x=TL[0]+16+t*(gw-32); guard.push({x:f(x-3.5),y:f(topY-4-Math.sin(t*Math.PI)*4),w:"7",h:"20"}); }
      const L=[BL[0]+10,botY],R=[BR[0]-10,botY],cey=botY;
      const beam={ path:`M ${P([L[0],cey-9])} L ${P([R[0],cey-9])} L ${P([R[0]+4,cey+11])} L ${P([L[0]-4,cey+11])} Z` };
      const slot=(R[0]-L[0])/n, rings=[], hw=TOOTH_W/2, teeth=[];
      for(let i=0;i<n;i++){
        const cx=L[0]+(i+0.5)*slot, top=cey-2, st=tMap[i]||"ok", alarm=isAlarm(st)?st:"none";
        const path=`M ${P([cx-hw,top])} L ${P([cx+hw,top])} L ${P([cx+TOOTH_W*0.22,top+TOOTH_H*0.86])} Q ${P([cx+TOOTH_W*0.14,top+TOOTH_H])} ${P([cx,top+TOOTH_H])} Q ${P([cx-TOOTH_W*0.14,top+TOOTH_H])} ${P([cx-TOOTH_W*0.22,top+TOOTH_H*0.86])} Z`;
        teeth.push({ path, color:BASE[st], stroke:sk(st), alarm });
        if(alarm!=="none") rings.push({cx:f(cx),cy:f(top+TOOTH_H*0.5),r:f(TOOTH_W*0.78),color:BASE[st]});
      }
      const lips=[];
      for(let i=0;i<n-1;i++){
        const cx=L[0]+(i+1)*slot, st=lMap[i]||"ok", alarm=isAlarm(st)?st:"none";
        lips.push({ x:f(cx-LIP_W/2),y:f(cey-LIP_H/2-3),w:f(LIP_W),h:f(LIP_H),color:BASE[st],stroke:sk(st),alarm });
        if(alarm!=="none") rings.push({cx:f(cx),cy:f(cey-2),r:f(LIP_W*0.8),color:BASE[st]});
      }
      const wings=[];
      if(wps>0){
        const center=[CX,topY+bucketH*0.4];
        [{a:BL,b:TL,k:"L"},{a:BR,b:TR,k:"R"}].forEach(cfg=>{
          const ab=[cfg.b[0]-cfg.a[0],cfg.b[1]-cfg.a[1]], len=Math.hypot(ab[0],ab[1]), u=[ab[0]/len,ab[1]/len];
          let v=[u[1],-u[0]]; const cm=lerp(cfg.a,cfg.b,0.4);
          if((cm[0]-center[0])*v[0]+(cm[1]-center[1])*v[1]<0) v=[-v[0],-v[1]];
          const pitchT=56/len;
          for(let kk=0;kk<wps;kk++){
            let t=0.5+(kk-(wps-1)/2)*pitchT; t=Math.max(0.1,Math.min(0.9,t));
            const c=lerp(cfg.a,cfg.b,t), key=cfg.k+kk, st=wMap[key]||"ok", alarm=isAlarm(st)?st:"none";
            const A=(s,d)=>[c[0]+u[0]*s+v[0]*d,c[1]+u[1]*s+v[1]*d];
            wings.push({ face:P(A(-WING_HL,-WING_IN),A(WING_HL,-WING_IN),A(WING_HL,WING_OUT),A(-WING_HL,WING_OUT)), color:BASE[st],stroke:sk(st),alarm });
            if(alarm!=="none") rings.push({cx:f(c[0]),cy:f(c[1]),r:"18",color:BASE[st]});
          }
        });
      }
      const anyMove = teeth.concat(lips,wings).some(c=>c.alarm==="move");
      return { vb:`0 0 ${f(vbW)} ${f(vbH)}`, body, bracketTf, guard, beam, teeth, lips, wings, rings,
        alarmCount:rings.length, hasAlarm:rings.length>0, anyMove,
        alarm:{ tf:`translate(${f(CX)} ${f(topY+bucketH*0.42)})` } };
    };

    // ===== fleet data (deterministic) =====
    const NAMES=["EX-201","EX-204","DG-112","SH-301","EX-220","DG-130","SH-310","EX-231","DG-141","SH-318","EX-244","DG-152","SH-325","EX-260","DG-163","SH-332","EX-271","DG-174","SH-340","EX-282"];
    const TYPES=["Excavator","Excavator","Digger","Shovel"];
    const SEED=[
      {t:{4:"prox"}}, {l:{3:"move"}, w:{L1:"lockoutnd"}}, {}, {t:{2:"nodata"}}, {w:{R0:"lockout"}},
      {}, {t:{3:"move"}}, {}, {l:{1:"nodata"}}, {}, {t:{5:"prox"}}, {}, {w:{L0:"lockout"}}, {},
      {l:{2:"move"}}, {}, {}, {t:{1:"nodata"}}, {}, {}
    ];
    const count = Math.max(1, Math.min(20, this.props.machineCount ?? 6));

    let machines = [];
    for(let i=0;i<count;i++){
      const n = 8 + ((i*3) % 7);          // 8..14
      const wps = 2 + (i % 3);            // 2..4
      const seed = SEED[i] || {};
      const b = buildBucket(n, wps, seed.t||{}, seed.l||{}, seed.w||{});
      const chip = b.hasAlarm
        ? { chipBg:"#2a1212", chipFg:"#ff9a9a", chipDot:"#FF5A5A", chipText:(b.anyMove?"MOVEMENT":"PROXIMITY") }
        : { chipBg:"#13241c", chipFg:"#7fd9b0", chipDot:BASE.ok, chipText:"OK" };
      machines.push({
        id:i, name:NAMES[i], type:TYPES[i%TYPES.length],
        ...b, ...chip,
        cardClass: b.hasAlarm ? "bh-alarmcard" : "",
        border: b.hasAlarm ? "#FF4D4D" : "#222d39",
        _sort: (b.hasAlarm?1000:0) + b.alarmCount
      });
    }
    // alarm machines first (moved to top-left)
    machines.sort((a,b)=> b._sort - a._sort || a.id - b.id);

    // responsive columns
    const cols = count<=1?1 : count<=2?2 : count<=6?3 : count<=12?4 : 5;
    const gridCols = `repeat(${cols}, minmax(0, 1fr))`;

    const fleetAlarms = machines.filter(m=>m.hasAlarm).length;
    const legend=[
      {label:"OK",color:BASE.ok},{label:"No data",color:BASE.nodata},
      {label:"Lockout",color:BASE.lockout},{label:"Lockout+ND",color:BASE.lockoutnd},
      {label:"Proximity",color:BASE.prox},{label:"Movement",color:BASE.move},
    ];

    return { machines, count, gridCols, legend, machineWord: count===1?"machine":"machines",
      fleetHasAlarm: fleetAlarms>0,
      fleetAlarmText: fleetAlarms===1 ? "1 MACHINE IN ALARM" : fleetAlarms+" MACHINES IN ALARM" };
  }
}
</script>
</body>
</html>
